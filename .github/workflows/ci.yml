name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Cache the GUT addon
        uses: actions/cache@v6
        with:
          path: addons/gut
          key: gut-${{ hashFiles('tools/gut.version.json') }}

      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1

      - name: Install GUT addon
        run: bash tools/install_gut.sh

      - name: Import project resources
        run: godot --headless --import

      - name: Run the GUT test suite
        run: godot --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests -ginclude_subdirs -gjunit_xml_file=junit.xml -gexit

      - name: Run the headless smoke test
        run: godot --headless --path . -s tools/smoke.gd

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-report
          path: junit.xml
          if-no-files-found: ignore
